name: C5VRX XIAO USB Diagnostic

on:
  pull_request:
    paths:
      - diagnostics/xiao_usb_diag/**
      - tools/C5VRX_XIAO_Flasher.py
      - tools/C5VRX_Flasher.py
      - tools/c5vrx_lab.py
      - tools/c5vrx_usb_protocol.py
      - .github/workflows/xiao-usb-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Build raw USB diagnostic firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build XIAO raw USB diagnostic
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32c5
          path: diagnostics/xiao_usb_diag
          command: >-
            idf.py set-target esp32c5 build &&
            grep -q '^CONFIG_ESP_CONSOLE_NONE=y$' sdkconfig &&
            mkdir -p ../../usb_diag_firmware &&
            cp build/flasher_args.json ../../usb_diag_firmware/ &&
            cp build/bootloader/bootloader.bin ../../usb_diag_firmware/bootloader.bin &&
            cp build/partition_table/partition-table.bin ../../usb_diag_firmware/partition-table.bin &&
            cp build/*.bin ../../usb_diag_firmware/ &&
            cp profile.json ../../usb_diag_firmware/profile.json
      - uses: actions/upload-artifact@v4
        with:
          name: c5vrx-xiao-usb-diag-firmware
          path: usb_diag_firmware/
          if-no-files-found: error

  windows:
    name: Build XIAO USB diagnostic console
    runs-on: windows-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c5vrx-xiao-usb-diag-firmware
          path: firmware
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial esptool numpy
      - name: Build diagnostic console
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name C5VRX-XIAO-USB-Diagnostic
          --paths tools
          --collect-all esptool
          --add-data "firmware;firmware"
          tools/C5VRX_XIAO_Flasher.py
      - uses: actions/upload-artifact@v4
        with:
          name: C5VRX-XIAO-USB-Diagnostic-Windows
          path: dist/C5VRX-XIAO-USB-Diagnostic.exe
          if-no-files-found: error
