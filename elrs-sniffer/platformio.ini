; =============================================================================
; ELRS-SNIFFER — passive ExpressLRS 2.4 GHz (SX1280) packet sniffer
; OSINT companion to the OUI-SPY 5.8 GHz detector. See README.md / BOARD.md.
;
; Nothing in this directory is wired into the ESP-IDF build at the repo root;
; it is a standalone PlatformIO sub-project. Build from THIS directory:
;     cd elrs-sniffer && pio run
; =============================================================================

[platformio]
description = ELRS sniffer (2.4 GHz SX1280, passive)

[common]
framework = arduino
monitor_speed = 460800
lib_deps =
    jgromes/RadioLib@^6.6.0
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -D ELRS_SNIFFER_VERSION=\"0.1.0\"
    -D CORE_DEBUG_LEVEL=2
    ; Pick ONE board header (pins + display setup) — see BOARD.md for what is
    ; verified vs guessed. The T-Embed S3 header is the first candidate because
    ; it is the board Konrad's ecosystem (KonradIT/C5VRX tembed-link) uses.
    -D BOARD_LILYGO_T_EMBED_S3
    ;-D BOARD_LILYGO_T3S3_2G4

; ---------------------------------------------------------------------------
; Generic bring-up env. Builds for a plain ESP32 devkit so CI/hosts without
; the exact LilyGo board can verify compilation. Pins come from board_pins.h.
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

; ---------------------------------------------------------------------------
; CANDIDATE BOARD ENV — pinout UNCONFIRMED. See BOARD.md.
; LilyGo T-Embed (ESP32-S3, ST7789 170x320, SPI). NOTE: stock T-Embed ships a
; sub-GHz CC1101, NOT an SX1280 — the 2.4 GHz radio section of board_pins.h is
; a documented guess until the physical unit is inspected.
; ---------------------------------------------------------------------------
[env:lilygo-t-embed-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
build_flags = ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${common.lib_deps}

; ---------------------------------------------------------------------------
; CANDIDATE BOARD ENV — LilyGo T3S3 2.4G (ESP32-S3 + SX1280, SSD1306 OLED).
; Display driver differs (SSD1306 over I2C) — TODO until that board is on hand.
; ---------------------------------------------------------------------------
;[env:lilygo-t3s3-2g4]
