; =============================================================================
; ELRS-SNIFFER — passive ExpressLRS 2.4 GHz (SX1280) packet sniffer
; OSINT companion to the OUI-SPY 5.8 GHz detector. See README.md / BOARD.md.
;
; Hardware: LilyGo T3-S3 (ESP32-S3) SX1280 2.4 GHz + 0.96" SSD1306 OLED.
; Pinout verified against LilyGo's factory sources — src/board_pins.h.
; Standalone PlatformIO sub-project; build from THIS directory.
; =============================================================================

[platformio]
description = ELRS sniffer (2.4 GHz SX1280, passive)

[common]
framework = arduino
monitor_speed = 460800
lib_deps =
    jgromes/RadioLib@^6.6.0
    olikraus/U8g2@^2.35.19
build_flags =
    -D ELRS_SNIFFER_VERSION=\"0.2.2\"
    -D BOARD_LILYGO_T3S3_SX1280
    -D T3S3_SX1280_PA
    -D CORE_DEBUG_LEVEL=2

; NOTE: ARDUINO_USB_CDC_ON_BOOT lives ONLY in the t3s3 env — on chips
; without USB (esp32dev CI env) it breaks the `Serial` declaration.

; ---------------------------------------------------------------------------
; Generic bring-up env (plain ESP32 devkit compile check; UI compiles but
; there is no display attached — serial JSON still works).
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

; ---------------------------------------------------------------------------
; TARGET ENV — LilyGo T3-S3 SX1280 (ESP32-S3, 4 MB embedded flash). Native
; USB CDC carries the JSON stream; flash with ./flash.sh (full erase,
; verified offsets, --flash-size 4MB).
; Variant: defaults to the PA build (-D T3S3_SX1280_PA in [common]) because
; the confirmed board is the "ranging"/PA listing — for a non-PA board,
; remove that define (banner + OLED state the active variant at boot).
; ---------------------------------------------------------------------------
[env:lilygo-t3s3-sx1280]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_flags = ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${common.lib_deps}
